[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
glam = { version = "0.29", features = ["std", "bytemuck"] }
winit = "0.30"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
bytemuck = { version = "1.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
wgpu = "24"
pollster = "0.4"

# Internal crates
ara-core = { path = "crates/ara-core" }

[package]
name = "ara"
version.workspace = true
edition.workspace = true
default-run = "ara"

[dependencies]
ara-core = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
bytemuck = { workspace = true }
image = "0.25.9"
